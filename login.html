<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports For All - Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="container-fluid main-container">
        <div class="row h-100">
            <!-- Left Panel - Login Form -->
            <div class="col-lg-6 col-md-6 col-12 left-panel">
                <div class="login-box">
                    <!-- Logo -->
                    <div class="logo-container">
                        <img src="assets/img/logos/sports-for-all-logo.png" alt="">
                    </div>

                    <!-- Header and Subheader -->
                    <h2 class="welcome-title">Welcome back!</h2>
                    <p class="welcome-subtitle">Login to your account</p>

                    <!-- Login Form -->
                    <form id="loginForm" novalidate>
                        <div class="form-group">
                            <div class="input-group">
                                <i class="fas fa-envelope input-icon"></i>
                                <input type="email" class="form-control" id="email" placeholder="Email Address"
                                    required>
                            </div>
                            <div class="error-message" id="emailError">Email address is required</div>
                        </div>

                        <div class="form-group">
                            <div class="input-group">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" class="form-control" id="password" placeholder="Password"
                                    required>
                                <i class="fas fa-eye-slash password-toggle" id="passwordToggle"></i>
                            </div>
                            <div class="error-message" id="passwordError">Password is required</div>
                            <div class="recover-password">
                                <a href="#" id="recoverPassword">Recover Password</a>
                            </div>
                        </div>

                        <button type="submit" class="btn login-btn">Login</button>
                    </form>
                </div>
            </div>

            <!-- Right Panel - Background Image Area -->
            <div class="col-lg-6 col-md-6 col-12 right-panel">

            </div>
        </div>
    </div>

    <script src="assets/js/login.js"></script>
</body>

</html>
