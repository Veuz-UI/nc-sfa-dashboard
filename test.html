<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subscription Plan History</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: #f9fafc;
      font-family: Arial, sans-serif;
    }
    .card {
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.05);
    }
    .legend-list {
      list-style: none;
      padding-left: 0;
    }
    .legend-list li {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
      font-size: 14px;
      color: #555;
    }
    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }

    #subscriptionChart{
      display: block;
    box-sizing: border-box;
    height: 300px;
    width: 300px;
    background-color: #f2f2f2;
    padding: 30px;
    border-radius: 50%;
    }
    .round{
      width: 300px;
      height: 300px;
      background-color: #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
    }
  </style>
</head>
<body>
<div class="container my-5">
  <div class="card">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="mb-0">Subscription Plan History</h6>
      <small class="text-muted">This Week ▼</small>
    </div>
    <div class="row">
      <div class="col-md-6 d-flex justify-content-center position-relative">
        <canvas id="subscriptionChart" ></canvas>
<div class="round"></div>
      </div>
      <div class="col-md-6">
        <ul class="legend-list">
          <li><span class="legend-color" style="background:#22c55e"></span>1 Day - 10 SAR (All Ages)</li>
          <li><span class="legend-color" style="background:#f97316"></span>1 Month - 40 SAR (Children age 6-15)</li>
          <li><span class="legend-color" style="background:#ef4444"></span>1 Month - 60 SAR (People over 15)</li>
          <li><span class="legend-color" style="background:#3b82f6"></span>1 Month - 120 SAR (Parent & 2 kids)</li>
          <li><span class="legend-color" style="background:#9333ea"></span>1 Month - 200 SAR (Parent & 2+ kids)</li>
          <li><span class="legend-color" style="background:#a855f7"></span>6 Months - 720 SAR (Parent & 2+ kids)</li>
          <li><span class="legend-color" style="background:#9ca3af"></span>Other</li>
        </ul>
      </div>
    </div>
  </div>
</div>

<script>
  const ctx = document.getElementById('subscriptionChart');
  new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: [
        '1 Day - 10 SAR (All Ages)',
        '1 Month - 40 SAR (Children age 6-15)',
        '1 Month - 60 SAR (People over 15)',
        '1 Month - 120 SAR (Parent & 2 kids)',
        '1 Month - 200 SAR (Parent & 2+ kids)',
        '6 Months - 720 SAR (Parent & 2+ kids)',
        'Other'
      ],
      datasets: [{
        data: [10, 40, 60, 120, 200, 720, 50], // Example values, adjust as needed
        backgroundColor: [
          '#22c55e', // green
          '#f97316', // orange
          '#ef4444', // red
          '#3b82f6', // blue
          '#9333ea', // purple
          '#a855f7', // violet
          '#9ca3af'  // gray
        ],
        borderWidth: 0
      }]
    },
    options: {
      cutout: '70%', // Inner radius for donut style
      plugins: {
        legend: { display: false } // Hide default legend
      }
    }
  });
</script>
</body>
</html>
